# 云端打包安卓 APK 工作流
# 触发方式：手动触发（workflow_dispatch），选择要打包的网站 URL
# 效果：在 GitHub 云端编译出 APK，上传到 Workflow Artifact 供下载

name: Build Android APK

on:
  # 手动触发：点击仓库 Actions → 本工作流 → Run workflow
  workflow_dispatch:
    inputs:
      app_name:
        description: 'App 显示名称（如：我的备忘录）'
        required: true
        default: '我的备忘录'
      app_id:
        description: 'Android 包名（如：com.example.webapp，需唯一）'
        required: true
        default: 'com.example.webapp'
      web_url:
        description: '要打包的网页地址（https://... 完整地址）'
        required: true
        default: 'https://etriku.huanjun.dpdns.org/deploy/DX7aC6/index.html'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      # 1. 拉取打包模板代码
      - name: 检出代码
        uses: actions/checkout@v4

      # 2. 安装 Node.js（跑 Capacitor 用）
      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. 安装 Java（Gradle 打包需要 JDK 17）
      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 4. 用国内镜像源安装 Capacitor（规则：下载国外资源用国内镜像）
      - name: 安装 Capacitor 依赖
        run: npm install --registry=https://registry.npmmirror.com

      # 5. 根据本次输入改写配置（App 名称、包名、网页地址）
      - name: 写入打包配置
        run: |
          cat > capacitor.config.json <<EOF
          {
            "appId": "${{ github.event.inputs.app_id }}",
            "appName": "${{ github.event.inputs.app_name }}",
            "webDir": "www",
            "server": {
              "url": "${{ github.event.inputs.web_url }}",
              "cleartext": false
            }
          }
          EOF

      # 6. 初始化并添加安卓原生平台
      - name: 初始化安卓平台
        run: |
          npx cap init "${{ github.event.inputs.app_name }}" "${{ github.event.inputs.app_id }}" --web-dir=www
          npx cap add android

      # 7. 同步网页配置到安卓壳
      - name: 同步配置
        run: npx cap sync android

      # 8. 用 Gradle 编译出 APK（Debug 版，无需签名，可直接安装）
      - name: 编译 APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # 9. 上传 APK 作为构建产物，供用户下载
      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.event.inputs.app_name }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
